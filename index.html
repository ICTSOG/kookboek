<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mijn Kookboek</title>
<style>
:root{--blue:#6cb4cc;--bg:#e3f4fb;--ink:#1c2b33;--mut:#5c6b73;--card:#f0f3f8}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Segoe UI,Arial,sans-serif;color:var(--ink);background:#fff}
header{display:flex;align-items:center;gap:24px;padding:14px 32px;border-bottom:1px solid #e5e9ec;position:sticky;top:0;background:#fff;z-index:5;flex-wrap:wrap}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;cursor:pointer}
header a{cursor:pointer;font-weight:500}
.search{flex:1;max-width:460px;border:1px solid #dde3e7;border-radius:30px;padding:11px 18px;background:#f6f8fa;font-size:15px}
main{max-width:1280px;margin:0 auto;padding:24px 32px 60px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:26px}
select,.pill{border:1px solid #dde3e7;border-radius:30px;padding:11px 18px;background:#fff;font-size:15px;color:var(--ink)}
details.pill{position:relative;cursor:pointer}details.pill>div{position:absolute;top:48px;left:0;width:340px;max-height:320px;overflow:auto;background:#fff;border:1px solid #dde3e7;border-radius:14px;padding:12px;box-shadow:0 8px 24px #0002;z-index:4}
.chip{display:inline-block;margin:3px;padding:5px 12px;border-radius:20px;border:1px solid #cfd8dd;font-size:13px;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.card{cursor:pointer}.card .im{aspect-ratio:1;border-radius:6px;background:#dbe7ee center/cover;display:flex;align-items:center;justify-content:center;font-size:54px}
.card h3{font-size:15px;font-weight:500;margin:10px 0 4px;line-height:1.5}.card small{color:var(--mut)}
.hero{background:var(--bg);padding:18px 32px}.hero .in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.hero .im{aspect-ratio:4/3;border-radius:8px;background:#cfe3ec center/cover;display:flex;align-items:center;justify-content:center;font-size:90px}
.hero h1{font-size:32px;line-height:1.25;margin:10px 0}.hero p{color:#33434b;line-height:1.7;font-size:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:30px;padding:13px 26px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn.w{background:#fff;color:var(--ink);border:1px solid #dde3e7}.btn.r{background:#c0392b}
.meta{display:flex;justify-content:center;gap:70px;padding:34px 0;flex-wrap:wrap}.meta small{display:block;color:var(--mut);font-size:11px}.meta b{font-size:15px}
.body{max-width:1200px;margin:0 auto;padding:0 32px 60px;display:grid;grid-template-columns:340px 1fr;gap:70px}
.ing{background:var(--card);border-radius:14px;padding:26px;align-self:start}.ing h2,.steps h2{margin:0 0 16px;font-size:20px}
.step{display:flex;gap:20px;margin-bottom:26px;line-height:1.7;font-size:14px}.step i{font-style:normal;font-size:18px;color:var(--mut);width:20px}
.srv{display:flex;align-items:center;justify-content:space-between;background:#e0e6ee;border-radius:30px;padding:6px 8px 6px 18px;font-size:14px;font-weight:500;margin-bottom:16px}
.srv button{width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-size:20px;cursor:pointer;margin-left:6px}
.ing li{list-style:none;display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #dde3ea;font-size:14px}.ing ul{padding:0;margin:0}
.form{max-width:760px;margin:0 auto}.form h2{margin-top:30px}.form label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid #cfd8dd;border-radius:8px;padding:10px;font:inherit}
.row{display:grid;grid-template-columns:80px 90px 1fr 120px 40px;gap:8px;margin-bottom:8px}
.empty{text-align:center;color:var(--mut);padding:60px}
@media(max-width:800px){.hero .in,.body{grid-template-columns:1fr;gap:24px}header{padding:12px 16px}main{padding:16px}.row{grid-template-columns:60px 70px 1fr 90px 34px}}
@media print{header,.hero .btn,.srv button{display:none}}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day{background:var(--card);border-radius:10px;padding:10px;min-height:150px;font-size:13px}.day.today{outline:2px solid var(--blue)}.day>b{display:block;margin-bottom:8px;text-transform:capitalize}
.meal{background:#fff;border-radius:8px;padding:8px;margin-bottom:6px}.meal a{cursor:pointer;font-weight:500}.meal span{display:block;color:var(--mut);margin-top:4px}.meal button{border:0;background:#e0e6ee;border-radius:50%;width:22px;height:22px;margin-left:3px;cursor:pointer}
.yr{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.mo>b{text-transform:capitalize}.mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;gap:2px}.mg i{font-style:normal;color:var(--mut)}.d{padding:5px 0;border-radius:6px;cursor:pointer}.d.has{background:var(--blue);color:#fff}.d.today{outline:2px solid var(--ink)}
.azr{padding:10px 4px;border-bottom:1px solid #eef1f3;cursor:pointer;display:flex;justify-content:space-between;gap:12px}.azr:hover{background:var(--card)}.azr small{color:var(--mut)}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:9}.modal>div{background:#fff;border-radius:14px;padding:20px;width:min(460px,92vw);max-height:80vh;overflow:auto}.modal input{width:100%;padding:10px;border:1px solid #cfd8dd;border-radius:8px;margin:8px 0}
.chk{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #eef1f3}.chk span{flex:1}.chk.done span{text-decoration:line-through;color:var(--mut)}.chk a{cursor:pointer;color:var(--mut)}.form input[type=checkbox]{width:auto}
@media(max-width:800px){.wk{grid-template-columns:1fr}.yr{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="logo" onclick="go('')">🍳 MIJN KOOKBOEK</div><a onclick="go('')">Recepten</a><a onclick="go('az')">A–Z</a><a onclick="go('week')">Weekmenu</a><a onclick="go('boodschappen')">Boodschappen</a>
<input class="search" id="q" placeholder="Waar ben je naar op zoek?"><span style="flex:1"></span><a onclick="go('beheer')" id="adm">⚙ Beheer</a></header>
<div id="app"></div>
<script src="seed.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,getDoc,getDocs,addDoc,setDoc,doc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyBPXLFZ9fX3A5HJENSMqVnsaJqmFDfIrgQ",authDomain:"snelpan.firebaseapp.com",projectId:"snelpan",storageBucket:"snelpan.firebasestorage.app",messagingSenderId:"394496649304",appId:"1:394496649304:web:677f4813674b29c690022d",measurementId:"G-EJZ4M7WBCL"});
const db=getFirestore(app),auth=getAuth(app),COL="gerechten";
const TYPES=["voorgerecht","hoofdgerecht","soep","ontbijt","lunch","dessert","bijgerecht","snack"];
const SOORTEN=["vegetarisch","vegan","vlees","kip","vis","pasta","rijst"];
const CATS=[["groente","Groente"],["vlees","Vlees"],["vis","Vis"],["overig","Overig"],["kruid","Kruid/smaak"]];
const ICON={vegetarisch:"🥦",vegan:"🥗",vlees:"🥩",kip:"🍗",vis:"🐟",pasta:"🍝",rijst:"🍚"};
let ERR="",DEMO=false,R=[],user=null,F={type:"",soort:"",tijd:"",ingr:new Set()},P=4,draft=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):"";
const num=n=>{n=Math.round(n*100)/100;return String(n).replace(".",",")};
const img=r=>r.afbeelding?`style="background-image:url('${esc(r.afbeelding)}')"`:"";
const ph=r=>r.afbeelding?"":(ICON[r.soorten[0]]||"🍽️");
window.go=h=>{location.hash=h?"#/"+h:"#"};
async function load(){ERR="";try{R=(await getDocs(collection(db,COL))).docs.map(d=>norm({id:d.id,...d.data()}))}catch(e){ERR=e.code||e.message;R=[]}
 DEMO=!R.length;if(DEMO)R=(window.SEED||[]).map(norm);if(!window.SEED)ERR+=" · seed.js niet gevonden";R.sort((a,b)=>(a.titel||"").localeCompare(b.titel||""));route()}
onAuthStateChanged(auth,async u=>{user=u;if(u)await personal();route()});
addEventListener("hashchange",route);$("#q").oninput=()=>{if(location.hash.length>1)go("");else route()};
function route(){const h=location.hash.replace(/^#\/?/,"");
 if(h.startsWith("recept/")){const r=R.find(x=>x.id===h.slice(7));if(r){P=r.por||4;return detail(r)}}
 if(h==="az")return az();if(h==="week")return week();if(h==="jaar")return year();if(h==="boodschappen")return shop();
 if(h==="beheer")return admin();
 if(h.startsWith("bewerk/")){return form(R.find(x=>x.id===h.slice(7)))}
 list()}
const ingNames=r=>[...new Set((r.ingredienten||[]).filter(i=>i.c==="groente"||i.c==="vlees"||i.c==="vis").map(i=>i.n.trim().toLowerCase()))];
function list(){
 const q=$("#q").value.toLowerCase().trim();
 const all=[...new Set(R.flatMap(ingNames))].sort();
 const ok=r=>(!F.type||r.types.includes(F.type))&&(!F.soort||r.soorten.includes(F.soort))&&(!F.fav||r.fav)
  &&(!F.tijd||(F.tijd==="90"?r.duur>60:r.duur<=+F.tijd))
  &&[...F.ingr].every(i=>ingNames(r).includes(i))
  &&(!q||(r.titel+" "+(r.ingredienten||[]).map(i=>i.n).join(" ")).toLowerCase().includes(q));
 const res=R.filter(ok);
 $("#app").innerHTML=`<main>${note()}<div class="filters">
 <select id="ft"><option value="">Type gerecht</option>${TYPES.map(t=>`<option ${F.type===t?"selected":""} value="${t}">${cap(t)}</option>`).join("")}</select>
 <select id="fd"><option value="">Duur</option>${[["15","≤ 15 min"],["30","≤ 30 min"],["45","≤ 45 min"],["60","≤ 60 min"],["90","> 60 min"]].map(([v,l])=>`<option ${F.tijd===v?"selected":""} value="${v}">${l}</option>`).join("")}</select>
 <select id="fs"><option value="">Soort</option>${SOORTEN.map(t=>`<option ${F.soort===t?"selected":""} value="${t}">${cap(t)}</option>`).join("")}</select>
 <details class="pill" ${F.ingr.size?"open":""}><summary>Ingrediënt${F.ingr.size?" ("+F.ingr.size+")":""}</summary><div>${all.length?all.map(i=>`<span class="chip ${F.ingr.has(i)?"on":""}" data-i="${esc(i)}">${esc(cap(i))}</span>`).join(""):"Nog geen ingrediënten"}</div></details>
 <a class="chip ${F.fav?"on":""}" id="ff">♥ Favorieten</a>${(F.type||F.soort||F.tijd||F.fav||F.ingr.size)?`<a class="chip" id="clr">✕ Wis filters</a>`:""}
 <span style="flex:1"></span><span style="color:var(--mut)">${res.length} gerecht${res.length==1?"":"en"}</span></div>
 ${res.length?`<div class="grid">${res.map(r=>`<div class="card" data-id="${r.id}"><div class="im" ${img(r)}>${ph(r)}</div><h3>${esc(r.titel)}</h3><small>${cap(r.types[0])} · ${r.duur||"?"} min${r.fav?" · ♥":""}</small></div>`).join("")}</div>`:`<div class="empty">${R.length?"Geen gerechten gevonden met deze filters.":"Nog geen gerechten. Voeg er een toe via Beheer."}</div>`}</main>`;
 $("#ft").onchange=e=>{F.type=e.target.value;list()};$("#fd").onchange=e=>{F.tijd=e.target.value;list()};$("#fs").onchange=e=>{F.soort=e.target.value;list()};
 document.querySelectorAll(".chip[data-i]").forEach(c=>c.onclick=e=>{e.preventDefault();const i=c.dataset.i;F.ingr.has(i)?F.ingr.delete(i):F.ingr.add(i);list();$("details.pill").open=true});
 $("#ff").onclick=()=>{F.fav=!F.fav;list()};if($("#clr"))$("#clr").onclick=()=>{F={type:"",soort:"",tijd:"",ingr:new Set()};list()};
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>go("recept/"+c.dataset.id));
}
function detail(r){
 const f=P/(r.por||4);
 $("#app").innerHTML=`<div class="hero"><div class="in"><div class="im" ${img(r)}>${ph(r)}</div><div>
 <div style="color:var(--mut);font-size:14px;cursor:pointer" onclick="go('')">← Recepten</div><h1>${esc(r.titel)}</h1>
 <p>${esc(r.beschrijving||"")}</p><div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">
 ${r.bron?`<a class="btn" href="${esc(r.bron)}" target="_blank" rel="noopener">Bekijk bronwebsite</a>`:""}
 <button class="btn w" onclick="print()">Print</button><button class="btn w" id="sl">🛒 Boodschappenlijst</button><button class="btn w" id="pn">📅 Inplannen</button>${user?`<button class="btn w" id="fv">${r.fav?"♥ Favoriet":"♡ Favoriet"}</button>`:""}${user?`<button class="btn w" onclick="go('bewerk/${r.id}')">Bewerk</button>`:""}</div></div></div></div>
 <div class="meta"><div><small>Type gerecht</small><b>${r.types.map(cap).join(", ")}</b></div><div><small>Totale tijd</small><b>${r.duur||"?"} min</b></div>
 <div><small>Ingrediënten</small><b>${(r.ingredienten||[]).length}</b></div><div><small>Soort</small><b>${r.soorten.map(cap).join(", ")}</b></div></div>
 <div class="body"><div class="ing"><h2>Ingrediënten</h2><div class="srv"><span>${P} personen</span><span><button id="mn">−</button><button id="pl">+</button></span></div>
 <ul>${(r.ingredienten||[]).map(i=>`<li><span>${esc(cap(i.n))}</span><b>${i.e!==""&&i.e!=null?num(i.e*f)+" "+esc(i.h||""):esc(i.h||"")}</b></li>`).join("")}</ul></div>
 <div class="steps"><h2>Instructies</h2>${(r.stappen||[]).map((s,k)=>`<div class="step"><i>${k+1}</i><div>${s.i&&s.i.length?`<small style="display:block;color:var(--mut);font-size:11px;margin-bottom:2px">${s.i.map(x=>(x.e!==""?num(x.e*f)+" ":"")+esc(x.h||"")+" "+esc(x.n)).join(", ")}</small>`:""}${esc(s.t)}</div></div>`).join("")}</div></div>`;
 scrollTo(0,0);
 $("#mn").onclick=()=>{if(P>1){P--;detail(r)}};$("#pl").onclick=()=>{P++;detail(r)};
 $("#sl").onclick=async()=>{if(!user)return go("boodschappen");await addList(r.ingredienten,P/(r.por||4),r.titel);go("boodschappen")};$("#pn").onclick=()=>planModal(r);if($("#fv"))$("#fv").onclick=async()=>{r.fav=!r.fav;await setDoc(doc(db,COL,r.id),{fav:r.fav},{merge:true});detail(r)};
}
function admin(){
 if(gate())return;
 $("#app").innerHTML=`<main><div class="form"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Beheer</h2><span><button class="btn" onclick="go('bewerk/nieuw')">+ Nieuw gerecht</button> <button class="btn w" id="im">Importeer backup</button> <button class="btn w" id="lo">Afmelden</button></span></div>
 <div style="margin-top:20px">${R.map(r=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e9ec"><span>${esc(r.titel)}</span><span><a class="chip" onclick="go('bewerk/${r.id}')">Bewerk</a><a class="chip" data-del="${r.id}">Verwijder</a></span></div>`).join("")||"Nog geen gerechten."}</div></div></main>`;
 $("#lo").onclick=()=>signOut(auth);$("#im").onclick=async()=>{if(confirm("De gerechten uit de backup (opnieuw) importeren? Bestaande versies met dezelfde id worden overschreven.")){await seed();go("")}};
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Dit gerecht verwijderen?")){await deleteDoc(doc(db,COL,b.dataset.del));await load()}});
}
const opt=(arr,v)=>arr.map(a=>`<option value="${a[0]||a}" ${(a[0]||a)===v?"selected":""}>${cap(a[1]||a)}</option>`).join("");
function form(r){
 if(!user)return go("beheer");
 const isNew=!r;r=r||{ingredienten:[{e:"",h:"",n:"",c:"groente"}],stappen:[],types:["hoofdgerecht"],soorten:["vegetarisch"],duur:30};
 draft={...r,ingredienten:r.ingredienten.map(i=>({...i}))};
 const rows=()=>draft.ingredienten.map((i,k)=>`<div class="row"><input data-k="${k}" data-f="e" placeholder="Aantal" value="${esc(i.e)}"><input data-k="${k}" data-f="h" placeholder="Eenheid" value="${esc(i.h)}"><input data-k="${k}" data-f="n" placeholder="Ingrediënt" value="${esc(i.n)}"><select data-k="${k}" data-f="c">${opt(CATS,i.c)}</select><button class="btn w" data-rm="${k}" style="padding:0">✕</button></div>`).join("");
 $("#app").innerHTML=`<main><div class="form"><h2>${isNew?"Nieuw gerecht":"Gerecht bewerken"}</h2>
 <h2>1. Ingrediënten <small style="font-weight:400;color:var(--mut)">(voor 4 personen)</small></h2><div id="rows">${rows()}</div><button class="btn w" id="add">+ Ingrediënt</button>
 <p style="font-size:12px;color:var(--mut)">Categorie bepaalt de filter: enkel groente, vlees en vis tellen mee. Kruiden en overig niet.</p>
 <h2>2. Kookwijze</h2><label>Eén stap per regel</label><textarea id="st" rows="8">${esc(r.stappen.map(x=>x.t).join("\n"))}</textarea>
 <h2>3. Gegevens</h2><label>Titel</label><input id="ti" value="${esc(r.titel)}"><label>Korte beschrijving</label><textarea id="de" rows="3">${esc(r.beschrijving)}</textarea>
 <label>Type gerecht (meerdere mogelijk)</label>${chips("types",TYPES,r.types)}<label>Soort</label>${chips("soorten",SOORTEN,r.soorten)}
 <label>Totale tijd (minuten)</label><input id="du" type="number" min="1" value="${r.duur||""}">
 <label>Afbeelding uploaden (wordt verkleind opgeslagen)</label><input id="fi" type="file" accept="image/*"><label>…of afbeeldings-URL</label><input id="iu" value="${esc((r.afbeelding||"").startsWith("data:")?"":r.afbeelding)}">
 <label>Link naar website met kookinstructies</label><input id="br" value="${esc(r.bron)}">
 <p><button class="btn" id="sv">Opslaan</button> <button class="btn w" onclick="go('beheer')">Annuleren</button></p><p id="er" style="color:#c0392b"></p></div></main>`;
 const bind=()=>{document.querySelectorAll("#rows [data-f]").forEach(el=>el.oninput=el.onchange=()=>draft.ingredienten[el.dataset.k][el.dataset.f]=el.value);
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.ingredienten.splice(b.dataset.rm,1);$("#rows").innerHTML=rows();bind()})};bind();document.querySelectorAll(".chip[data-g]").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
 $("#add").onclick=()=>{draft.ingredienten.push({e:"",h:"",n:"",c:"groente"});$("#rows").innerHTML=rows();bind()};
 $("#sv").onclick=async()=>{
  const ings=draft.ingredienten.filter(i=>i.n.trim()).map(i=>({e:i.e===""?"":parseFloat(String(i.e).replace(",",".")),h:i.h.trim(),n:i.n.trim(),c:i.c}));
  if(!$("#ti").value.trim()||!ings.length)return $("#er").textContent="Titel en minstens één ingrediënt zijn verplicht.";
  let a=$("#iu").value.trim()||(r.afbeelding||"");const file=$("#fi").files[0];if(file)a=await shrink(file);
  const data={titel:$("#ti").value.trim(),beschrijving:$("#de").value.trim(),types:sel("types"),soorten:sel("soorten"),duur:+$("#du").value||0,ingredienten:ings,stappen:$("#st").value.split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({t,i:(r.stappen.find(x=>x.t===t)||{}).i||[]})),afbeelding:a,bron:$("#br").value.trim(),fav:!!r.fav,por:r.por||4};
  try{isNew?await addDoc(collection(db,COL),data):await setDoc(doc(db,COL,r.id),data);await load();go("beheer")}catch(e){$("#er").textContent="Opslaan mislukt: "+e.code}};
}
function shrink(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};im.src=URL.createObjectURL(file)})}
const norm=r=>({...r,types:r.types||(r.type?[r.type]:[]),soorten:r.soorten||(r.soort?[r.soort]:[]),ingredienten:r.ingredienten||[],stappen:(r.stappen||[]).map(x=>typeof x=="string"?{t:x,i:[]}:x)});
const PAN0=["zout","peper","olijfolie","water"],iso=d=>d.toLocaleDateString("sv"),base=n=>n.toLowerCase().replace(/\s*\(.*\)/,"").trim(),sel=g=>[...document.querySelectorAll(`.chip.on[data-g=${g}]`)].map(c=>c.dataset.v);
